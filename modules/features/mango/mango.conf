# Misc
drag_tile_to_tile=1
focus_cross_monitor=1
# syncobj_enable=1
allow_tearing=2

# Blur
blur=1
blur_optimized=1

# Animations
tag_animation_direction=0
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0

# Binds
keymode=default
bind=ALT,TAB,toggleoverview
bind=SUPER,r,reload_config
bind=SUPER,t,spawn_shell,ghostty +new-window
bind=SUPER+SHIFT,d,spawn,rofi -show drun
bind=SUPER,d,spawn_shell,noctalia-shell ipc call launcher toggle
bind=SUPER,p,spawn_shell,noctalia-shell ipc call sessionMenu toggle
bind=SUPER+ALT,l,spawn_shell,noctalia-shell ipc call lockScreen lock
bind=SUPER,q,killclient
bind=SUPER,b,zoom
bind=SUPER,n,switch_proportion_preset

# Binds - Scratchpad
bind=SUPER,i,minimized
bind=ALT,z,toggle_scratchpad
bind=SUPER+SHIFT,i,restore_minimized

# Binds - Layouts
binds=CTRL+ALT,l,setkeymode,layout

keymode=layout
bind=NONE,Escape,setkeymode,default
bind=NONE,n,switch_layout
bind=NONE,s,setlayout,scroller
bind=NONE,t,setlayout,tile
bind=NONE,c,setlayout,center_tile
bind=NONE,g,setlayout,grid

# Binds - Window Management
keymode=default
bind=SUPER,v,togglefloating
bind=SUPER,g,toggleglobal
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,equal,resizewin,+100,0
bind=SUPER,minus,resizewin,-100,0
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# mouse binds for overview
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0

# Binds - Window Focus
keymode=default
binds=SUPER,h,focusdir,left
binds=SUPER,l,focusdir,right
binds=SUPER,j,focusdir,down
binds=SUPER,k,focusdir,up
binds=SUPER,Left,focusdir,left
binds=SUPER,Right,focusdir,right
binds=SUPER,Down,focusdir,down
binds=SUPER,Up,focusdir,up
binds=SUPER+SHIFT,h,focusmon,left
bindss=SUPER+SHIFT,Left,focusmon,left
binds=SUPER+SHIFT,l,focusmon,right
binds=SUPER+SHIFT,Right,focusmon,right
binds=SUPER+SHIFT,j,focusmon,down
binds=SUPER+SHIFT,Down,focusmon,down
binds=SUPER+SHIFT,k,focusmon,up
binds=SUPER+SHIFT,Up,focusmon,up
binds=SUPER+CTRL,h,exchange_client,left
binds=SUPER+CTRL,l,exchange_client,right
binds=SUPER+CTRL,j,exchange_client,down
binds=SUPER+CTRL,k,exchange_client,up

# Binds - Tags
# Switch to specific tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# use pgup (112) and pgdown (117) to move between views
bind=SUPER,code:112,viewtoleft
bind=SUPER,code:117,viewtoright
bind=SUPER+SHIFT,code:112,tagtoleft
bind=SUPER+SHIFT,code:117,tagtoright

# Move window to specific tag
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Gesture binds
gesturebind=none,up,3,viewtoleft_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,down,3,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Tag Declaration
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:tile
tagrule=id:7,layout_name:center_tile
tagrule=id:8,layout_name:center_tile
tagrule=id:9,layout_name:scroller


# Monitor Rules
monitorrule=name:^eDP-1$,width:1920,height:1200,refresh:60,x:2560,y:0
monitorrule=serial:23280B003180,model:M27Q X,width:2560,height:1440,refresh:240,x:0,y:0,vrr:1

# Brightness
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bindl=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bindl=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

# Volume
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bindl=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# PLayback
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause

# noctalia styles
source-optional=~/.config/mango/noctalia.conf

# Binds - Screenshots
binds=NONE,Print,spawn_shell,grim -g "$(slurp)" - | satty --filename - --copy-command wl-copy

# Scroller Settings
scroller_default_proportion = 0.75
scroller_focus_center = 1

# Window Rules
windowrule=width:400,height:900,appid:steam,title:^Friends List$
